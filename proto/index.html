<title>Stickblam Movement Testbed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
:root{
  --paper:#EDEEE8; --ink:#16181F; --ink-2:#4A4F59; --ink-3:#878D97;
  --edge:#C9CCC3; --margin:#BE4F47;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-sans:"IBM Plex Sans",system-ui,sans-serif;
  --f-disp:"Permanent Marker","Comic Sans MS",cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-sans)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;background:var(--paper)}
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-mono);font-size:12px}
#hud button,#hud input{pointer-events:auto}

/* ---- crosshair: four scratched ticks round a gap. Nothing here is straight. ---- */
#crosshair{position:absolute;left:50%;top:50%;width:0;height:0;--spread:8px;--scope:0}
#crosshair i{position:absolute;background:var(--ink);opacity:1;
  box-shadow:0 0 0 2px rgba(237,238,232,.85), 0 0 5px rgba(237,238,232,.9);
  transition:opacity .12s;transform-origin:center}
#crosshair i.t{left:-2px;width:4px;height:16px;bottom:var(--spread);transform:rotate(2.5deg)}
#crosshair i.b{left:-2px;width:4px;height:16px;top:var(--spread);transform:rotate(-2deg)}
#crosshair i.l{top:-2px;height:4px;width:16px;right:var(--spread);transform:rotate(-2.5deg)}
#crosshair i.r{top:-2px;height:4px;width:16px;left:var(--spread);transform:rotate(2deg)}
/* the scope ring fades in as you bring the pen up */
#crosshair i.ring{left:50%;top:50%;width:150px;height:150px;background:none;
  border:2px solid var(--ink);border-radius:50%;
  transform:translate(-50%,-50%) rotate(-4deg) scaleY(.94) scale(calc(.6 + var(--scope) * .4));
  opacity:calc(var(--scope) * .8);border-style:dashed}
#crosshair.locked i{opacity:.28;background:var(--margin)}
#crosshair.locked i.ring{background:none;border-color:var(--margin);opacity:calc(var(--scope) * .4)}

/* ---- scraps ----
   Everything flat in this world is on a piece of paper someone tore out. The
   polygon is cut in JS by the same generator the renderer uses (gfx/paper.js);
   the drop-shadows are what put an INK LINE on the torn edge, since clip-path
   removes any border you give the element. Four offsets, no blur: that traces
   the clipped silhouette instead of smudging behind it. Padding has to clear
   the deepest tear or the clip eats the text. */
.scrap{background:transparent no-repeat;background-size:100% 100%;border:0}

/* ---- readout ---- */
#readout{position:absolute;left:14px;top:14px;padding:19px 23px;min-width:206px}
.rrow{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--ink)}
.rgrid{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px}
.rgrid span{color:var(--ink-3)}
.rgrid em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---- map card ---- */
/* Both cards stack in one column bottom-left, clear of the weapon, which owns
   the bottom-right the way a viewmodel always does. */
#cards{position:absolute;left:14px;bottom:18px;display:flex;flex-direction:column;
  gap:8px;align-items:flex-start;max-width:310px}
#mapcard{width:300px;padding:19px 23px 21px;line-height:1.4}
#mapcard b{font-family:var(--f-disp);font-size:17px;display:block;font-weight:400}
#mapcard em{font-style:normal;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--margin);display:block;margin:1px 0 5px}
#mapcard span{display:block;font-size:11.5px;color:var(--ink-2);font-family:var(--f-sans)}
#mapcard i{display:block;font-style:normal;font-size:10px;color:var(--ink-3);margin-top:5px}

/* ---- weapon card: what is in your hands, and what it will take ---- */
#weaponcard{width:300px;padding:19px 23px 17px;
  line-height:1.35;font-family:var(--f-sans)}
#weaponcard b{font-family:var(--f-disp);font-size:19px;display:block;font-weight:400}
#weaponcard span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px}
#weaponcard u{display:flex;gap:4px;text-decoration:none;margin:7px 0 5px;flex-wrap:wrap}
#weaponcard s{text-decoration:none;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;
  border:1px solid var(--ink-3);padding:2px 5px;color:var(--ink-2)}
#weaponcard i{display:block;font-style:normal;font-size:10.5px;color:var(--margin)}
#mapcard.fade{animation:mapin .5s ease}
@keyframes mapin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- world labels: written in the margin, slightly crooked ---- */
.wlabel{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-mono);
  font-size:11px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;
  transform-origin:center;pointer-events:none;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper)}
.wlabel.station{font-family:var(--f-disp);font-size:17px;letter-spacing:0;color:var(--ink);text-transform:none}
.wlabel.home{font-family:var(--f-disp);font-size:14px;color:var(--margin);text-transform:none}
.wlabel.note{color:var(--margin);font-size:10.5px}

/* ---- panel ---- */
#panel{position:absolute;right:0;top:0;bottom:0;width:308px;overflow-y:auto;
  background:rgba(237,238,232,.94);border-left:1px solid var(--edge);
  padding:12px 14px 30px;pointer-events:auto;transition:transform .16s ease}
#panel.hidden{transform:translateX(100%)}
.phead{font-family:var(--f-disp);font-size:19px;margin-bottom:2px}
.phead span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-top:1px}
.kb{display:grid;grid-template-columns:112px 1fr;gap:6px;font-size:10.5px;
  color:var(--ink-2);padding:2px 0;line-height:1.35}
.kb kbd{font-family:var(--f-mono);background:transparent;border:1px solid var(--edge);
  padding:1px 4px;text-align:center;color:var(--ink);font-size:10px}
#keys{margin:10px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
.sgroup{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--margin);
  margin:13px 0 5px;font-weight:600}
.srow{display:grid;grid-template-columns:96px 1fr 44px;gap:6px;align-items:center;
  font-size:10.5px;padding:1.5px 0}
.sname{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.srow input[type=range]{width:100%;height:14px;accent-color:var(--margin);background:transparent}
.prow{display:flex;gap:6px;margin-top:16px}
#panel button{font-family:var(--f-mono);font-size:10.5px;padding:5px 9px;cursor:pointer;
  background:transparent;border:1px solid var(--edge);color:var(--ink-2)}
#panel button:hover{border-color:var(--margin);color:var(--margin)}
#copied{font-size:10px;color:var(--margin);margin-top:7px;height:12px}

#hint{position:absolute;left:50%;top:22px;transform:translateX(-50%);
  font-size:11.5px;color:var(--ink-2);padding:17px 28px;letter-spacing:.03em;transition:opacity .4s}
#hint.gone{opacity:0}
#fatal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:var(--f-sans);gap:6px;padding:24px;text-align:center}
#fatal b{font-family:var(--f-disp);font-size:22px}
#fatal p{max-width:46ch;color:var(--ink-2);font-size:14px;line-height:1.5}
@media (max-width:700px){#panel{width:100%}#mapcard{display:none}.kb{grid-template-columns:96px 1fr}}
</style>

<canvas id="view"></canvas>
<div id="hud"></div>
<script type="module" src="src/main.js"></script>
